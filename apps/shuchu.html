<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="description" content="時間を大切にするための、小さなブラウザアプリ集。無料・登録不要・データは端末の中だけ。"><link rel="canonical" href="https://shukiuematsu.github.io/atonankai-lab/apps/shuchu.html"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1422'/%3E%3Cellipse cx='16' cy='16' rx='9' ry='5.5' fill='%23e58aa3' transform='rotate(-35 16 16)'/%3E%3C/svg%3E"><meta property="og:type" content="website"><meta property="og:site_name" content="あと何回 ラボ"><meta property="og:title" content="集中証明書"><meta property="og:description" content="時間を大切にするための、小さなブラウザアプリ集。無料・登録不要・データは端末の中だけ。"><meta property="og:url" content="https://shukiuematsu.github.io/atonankai-lab/apps/shuchu.html"><meta property="og:image" content="https://shukiuematsu.github.io/atonankai-lab/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="集中証明書"><meta name="twitter:description" content="時間を大切にするための、小さなブラウザアプリ集。無料・登録不要・データは端末の中だけ。"><meta name="twitter:image" content="https://shukiuematsu.github.io/atonankai-lab/og.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><script>window.claude=window.claude||{use:async function(n){if(n!=="downloads")return null;return{save:async function(r){var b=r.data instanceof Blob?r.data:new Blob([r.data]);var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);return{status:"saved"}}}}};</script><title>集中証明書</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 布置: 黒い部屋にひとつの数字。逃げると赤い印が残る。終われば一枚の証明書。 */
:root{--bg:#ecebe7;--paper:#f8f7f3;--fg:#17181a;--mute:--#6c6f74;--mute:#6c6f74;--line:#d4d3ce;--accent:#9a1b1b;--room:#0b0c0e;--roomtext:#f1efe8;
  --serif:"Zen Antique","Hiragino Mincho ProN",serif;--body:"Zen Kaku Gothic New","Hiragino Sans",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101113;--paper:#17191c;--fg:#efede7;--mute:#9a9ca1;--line:#2b2e33;--accent:#e05252;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101113;--paper:#17191c;--fg:#efede7;--mute:#9a9ca1;--line:#2b2e33;--accent:#e05252;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 72px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--serif);font-size:30px;margin:0;letter-spacing:.1em;font-weight:400}
.lead{color:var(--mute);font-size:14px;margin:2px 0 0;max-width:40em}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:14px}
input[type=text]{font:inherit;font-size:18px;color:var(--fg);background:transparent;border:0;border-bottom:1.5px solid var(--line);padding:8px 2px;width:100%}
input[type=text]:focus{outline:none;border-bottom-color:var(--accent)}
.durs{display:flex;gap:8px;flex-wrap:wrap}
.dur{font:inherit;font-size:14px;font-weight:700;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.dur[aria-pressed=true]{background:var(--fg);color:var(--paper);border-color:var(--fg)}
.go{font-family:var(--serif);font-size:18px;letter-spacing:.3em;padding:14px;border:0;background:var(--fg);color:var(--paper);cursor:pointer}
.hist{display:grid;gap:6px;font-size:13px}
.hist div{display:grid;grid-template-columns:1fr auto auto;gap:12px;border-bottom:1px solid var(--line);padding:6px 0}
.hist .m{color:var(--mute)}
.room{position:fixed;inset:0;background:var(--room);color:var(--roomtext);display:grid;place-items:center;z-index:20;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.room .in{text-align:center;display:grid;gap:14px;max-width:90vw}
.room .task{font-family:var(--serif);font-size:clamp(18px,4vw,26px);opacity:.85;text-wrap:balance}
.room .time{font-family:var(--serif);font-size:clamp(84px,24vw,200px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.room .esc{font-size:14px;opacity:.7;letter-spacing:.2em}
.room .marks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:12px}
.room .marks i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.room .btns{display:flex;gap:10px;justify-content:center;margin-top:18px}
.room button{font:inherit;font-size:13px;letter-spacing:.2em;padding:10px 18px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--roomtext);cursor:pointer}
.cert{display:grid;gap:12px}
.cert img{display:block;width:100%;max-width:440px;height:auto;margin:0 auto;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-size:14px;font-weight:700;padding:10px 16px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--fg);color:var(--paper)}
.note{font-size:12px;color:var(--mute);line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--paper);padding:10px 18px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
</style>
<div class="wrap">
  <div><h1>集中証明書</h1><p class="lead">ひとつの仕事を決めて、部屋に入る。別のタブやアプリに逃げた回数が記録され、終わると証明書が一枚発行されます。誰にも見せなくていい。けれど、見せたくなる。</p></div>
  <div class="panel" id="setup">
    <label style="font-size:12px;color:var(--mute)">いま、やること（ひとつだけ）<input type="text" id="task" placeholder="例：企画書の1章を書き切る" maxlength="60"></label>
    <div class="durs" id="durs"><button class="dur" type="button" data-m="25" aria-pressed="true">25分</button><button class="dur" type="button" data-m="50" aria-pressed="false">50分</button><button class="dur" type="button" data-m="90" aria-pressed="false">90分</button></div>
    <button class="go" id="start" type="button">部屋に入る</button>
    <div class="note">タブを切り替える・別のアプリに移る・ウィンドウから離れると「逃亡」として数えます。スマホは画面を消しても数えます。</div>
  </div>
  <div class="panel cert" id="certpanel" hidden>
    <img id="certimg" alt="集中証明書">
    <canvas id="certcv" hidden></canvas>
    <div class="btns"><button class="btn primary" id="copyimg" type="button">画像をコピー</button><button class="btn" id="save" type="button">画像を保存</button><button class="btn" id="again" type="button">もう一度</button></div>
  </div>
  <div class="panel"><div style="font-size:12px;color:var(--mute);letter-spacing:.15em">これまでの証明書</div><div class="hist" id="hist"><div class="m">まだありません。</div></div></div>
</div>
<div class="room" id="room" hidden><div class="in"><div class="task" id="rtask"></div><div class="time" id="rtime">25:00</div><div class="esc">逃亡 <span id="resc">0</span> 回</div><div class="marks" id="marks"></div><div class="btns"><button id="quit" type="button">途中でやめる</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const store={get(k,d){try{const v=localStorage.getItem('shuchu:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('shuchu:'+k,JSON.stringify(v));}catch(e){}}};
  let mins=25, start=0, end=0, esc=[], tick=null, awayAt=null, task='';
  $('durs').addEventListener('click',e=>{const b=e.target.closest('.dur');if(!b)return;mins=+b.dataset.m;[...$('durs').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
  $('start').addEventListener('click',()=>{task=$('task').value.trim()||'名もなき仕事';start=Date.now();end=start+mins*6e4;esc=[];$('rtask').textContent=task;$('room').hidden=false;$('resc').textContent='0';$('marks').innerHTML='';tick=setInterval(loop,250);loop();});
  function loop(){const left=Math.max(0,end-Date.now());const m=Math.floor(left/6e4),s=Math.floor(left%6e4/1e3);$('rtime').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(left<=0)finish(true);}
  function away(){ if($('room').hidden||awayAt) return; awayAt=Date.now(); }
  function back(){ if($('room').hidden||!awayAt) return; const d=Date.now()-awayAt; if(d>1500){ esc.push({at:awayAt-start,d}); $('resc').textContent=esc.length; $('marks').innerHTML=esc.map(()=>'<i></i>').join(''); } awayAt=null; }
  document.addEventListener('visibilitychange',()=>document.hidden?away():back()); window.addEventListener('blur',away); window.addEventListener('focus',back);
  $('quit').addEventListener('click',()=>finish(false));
  async function finish(done){
    clearInterval(tick); if(awayAt) back(); $('room').hidden=true;
    const total=Math.min(Date.now()-start,mins*6e4); const awayMs=esc.reduce((s,e)=>s+e.d,0); const focus=Math.max(0,Math.round((1-awayMs/total)*100));
    const rec={task,mins,done,esc:esc.length,focus,at:Date.now(),total}; const h=store.get('hist',[]); h.unshift(rec); store.set('hist',h.slice(0,30)); renderHist();
    try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=660;g.gain.value=.05;o.start();o.stop(ac.currentTime+.6);}catch(e){}
    await drawCert(rec); $('certpanel').hidden=false; $('setup').hidden=true; $('certpanel').scrollIntoView({behavior:'smooth'});
  }
  async function drawCert(r){
    try{await document.fonts.load('400 60px "Zen Antique"');}catch(e){}
    const cv=$('certcv'); const W=1080,H=1350; cv.width=W;cv.height=H; const x=cv.getContext('2d');
    x.fillStyle='#f6f3ea'; x.fillRect(0,0,W,H); x.strokeStyle='#17181a'; x.lineWidth=3; x.strokeRect(40,40,W-80,H-80); x.lineWidth=1; x.strokeRect(56,56,W-112,H-112);
    const S='"Zen Antique","Hiragino Mincho ProN",serif', G='"Zen Kaku Gothic New","Hiragino Sans",sans-serif';
    x.fillStyle='#17181a'; x.textAlign='center'; x.font=`400 84px ${S}`; x.fillText('集 中 証 明 書',W/2,200);
    x.font=`500 26px ${G}`; x.fillStyle='#6c6f74'; x.fillText(new Date(r.at).toLocaleString('ja-JP',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}),W/2,250);
    x.fillStyle='#17181a'; x.font=`400 40px ${S}`; const t=r.task.length>18?r.task.slice(0,18)+'…':r.task; x.fillText('「'+t+'」',W/2,400);
    x.font=`500 28px ${G}`; x.fillStyle='#6c6f74'; x.fillText('上記の仕事に、下記のとおり集中したことを証明する',W/2,460);
    x.fillStyle='#17181a'; x.font=`400 230px ${S}`; x.fillText(`${Math.round(r.total/6e4)}`,W/2-60,760); x.font=`400 60px ${S}`; x.fillText('分',W/2+170,760);
    x.font=`500 32px ${G}`; x.textAlign='left'; const rows=[['逃亡回数',`${r.esc} 回`],['集中率',`${r.focus} %`],['結果',r.done?'完走':'途中退室']];
    rows.forEach(([k,v],i)=>{const y=900+i*70; x.fillStyle='#6c6f74'; x.fillText(k,200,y); x.fillStyle=k==='逃亡回数'&&r.esc>0?'#9a1b1b':'#17181a'; x.textAlign='right'; x.fillText(v,W-200,y); x.textAlign='left'; x.strokeStyle='#d4d3ce'; x.beginPath(); x.moveTo(200,y+16); x.lineTo(W-200,y+16); x.stroke();});
    x.fillStyle='#9a1b1b'; x.strokeStyle='#9a1b1b'; x.lineWidth=5; x.beginPath(); x.arc(W-240,1200,70,0,7); x.stroke(); x.font=`400 44px ${S}`; x.textAlign='center'; x.fillText(r.esc===0?'無逃':'集中',W-240,1216);
    x.fillStyle='#6c6f74'; x.font=`500 22px ${G}`; x.textAlign='left'; x.fillText('#集中証明書',200,1215);
    $('certimg').src=cv.toDataURL('image/png');
  }
  $('copyimg').addEventListener('click',()=>{try{const item=new ClipboardItem({'image/png':new Promise(res=>$('certcv').toBlob(res,'image/png'))});navigator.clipboard.write([item]).then(()=>toast('画像をコピーしました')).catch(()=>toast('この環境ではコピーできません。画像を長押し／右クリックで保存してください'));}catch(e){toast('この環境ではコピーできません。画像を長押し／右クリックで保存してください');}});
  (async()=>{let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){} if(!dl){$('save').hidden=true;return;} $('save').addEventListener('click',()=>$('certcv').toBlob(async b=>{try{await dl.save({filename:'shuchu.png',data:b});toast('保存しました');}catch(e){if(!e||e.code!=='declined')toast('保存できませんでした');}},'image/png'));})();
  $('again').addEventListener('click',()=>{$('certpanel').hidden=true;$('setup').hidden=false;});
  function renderHist(){const h=store.get('hist',[]);if(!h.length)return;$('hist').innerHTML=h.slice(0,10).map(r=>`<div><span>${r.task}</span><span class="m">${new Date(r.at).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})} ・ ${Math.round(r.total/6e4)}分</span><span>${r.esc===0?'無逃':'逃亡'+r.esc+'回'} ・ ${r.focus}%</span></div>`).join('');}
  function toast(m){$('toast').textContent=m;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2000);}
  renderHist();
})();
</script>
</head><body></body></html>
