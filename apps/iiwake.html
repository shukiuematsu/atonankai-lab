<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="description" content="時間を大切にするための、小さなブラウザアプリ集。無料・登録不要・データは端末の中だけ。"><link rel="canonical" href="https://shukiuematsu.github.io/atonankai-lab/apps/iiwake.html"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1422'/%3E%3Cellipse cx='16' cy='16' rx='9' ry='5.5' fill='%23e58aa3' transform='rotate(-35 16 16)'/%3E%3C/svg%3E"><meta property="og:type" content="website"><meta property="og:site_name" content="あと何回 ラボ"><meta property="og:title" content="言い訳ゲーム"><meta property="og:description" content="時間を大切にするための、小さなブラウザアプリ集。無料・登録不要・データは端末の中だけ。"><meta property="og:url" content="https://shukiuematsu.github.io/atonankai-lab/apps/iiwake.html"><meta property="og:image" content="https://shukiuematsu.github.io/atonankai-lab/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="言い訳ゲーム"><meta name="twitter:description" content="時間を大切にするための、小さなブラウザアプリ集。無料・登録不要・データは端末の中だけ。"><meta name="twitter:image" content="https://shukiuematsu.github.io/atonankai-lab/og.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><script>window.claude=window.claude||{use:async function(n){if(n!=="downloads")return null;return{save:async function(r){var b=r.data instanceof Blob?r.data:new Blob([r.data]);var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);return{status:"saved"}}}}};</script><title>言い訳ゲーム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=Yuji+Boku&display=swap">
<style>
/* 布置: 役所の届出用紙。ルールは付箋で増え、違反は赤い判子で却下される。 */
:root{
  --bg:#dcd9d1; --paper:#fbfaf5; --fg:#1d1b17; --mute:#75716a; --rule:#c9c3b4; --line:#8f8a7e;
  --red:#c0392b; --red-soft:#f6d9d5; --blue:#1f4e8c; --blue-soft:#dbe6f5; --ok:#2e7d4f; --ok-soft:#d9eee1; --fusen:#fff2a8;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif; --brush:"Yuji Boku","Zen Old Mincho",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1b1a17; --paper:#f3f0e6; --fg:#1d1b17; --mute:#75716a; --rule:#c9c3b4; --line:#8f8a7e; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1b1a17; --paper:#f3f0e6; --fg:#1d1b17; --mute:#75716a; --rule:#c9c3b4; --line:#8f8a7e; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mincho);line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
.sheet{max-width:720px;margin:0 auto;background:var(--paper);border:1px solid var(--line);padding:34px 28px 40px;position:relative;box-shadow:0 20px 50px -30px rgba(0,0,0,.6)}
.sheet::before{content:"";position:absolute;inset:8px;border:1px solid var(--line);pointer-events:none}
.head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;border-bottom:3px double var(--line);padding-bottom:14px}
h1{font-size:clamp(28px,6vw,40px);font-weight:900;margin:0;letter-spacing:.3em}
.sub{font-size:13px;color:var(--mute);margin:4px 0 0}
.box{border:1px solid var(--line);font-size:11px;padding:6px 10px;display:grid;gap:2px;min-width:120px}
.box b{font-size:16px;letter-spacing:.1em}
.field{margin-top:22px;display:grid;gap:8px}
.lbl{font-size:13px;letter-spacing:.2em;color:var(--mute);display:flex;justify-content:space-between;align-items:baseline}
.lbl span:last-child{font-variant-numeric:tabular-nums}
textarea{font:inherit;font-size:18px;line-height:36px;width:100%;min-height:180px;resize:vertical;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 12px;color:var(--fg);
  background:repeating-linear-gradient(transparent 0 35px,var(--rule) 35px 36px) var(--paper);background-attachment:local}
textarea:focus{outline:none;box-shadow:inset 0 0 0 1px var(--blue)}
.rules{margin-top:22px;display:grid;gap:10px}
.rule{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--rule);background:var(--paper);position:relative;transition:background .3s}
.rule .no{font-weight:900;font-size:18px;letter-spacing:.05em}
.rule .tx{font-size:15px}
.rule .tx small{display:block;font-size:12px;color:var(--mute)}
.rule.pass{background:var(--ok-soft)}
.rule.fail{background:var(--red-soft)}
.stamp{font-family:var(--brush);font-size:18px;letter-spacing:.1em;border:2.5px solid;border-radius:50%;width:56px;height:56px;display:grid;place-items:center;transform:rotate(-12deg);line-height:1}
.pass .stamp{color:var(--ok);border-color:var(--ok)}
.fail .stamp{color:var(--red);border-color:var(--red);animation:slam .35s cubic-bezier(.2,1.4,.4,1)}
.new{animation:drop .5s cubic-bezier(.2,1.2,.3,1)}
@keyframes slam{0%{transform:rotate(-12deg) scale(2.2);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}
@keyframes drop{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
.fusen{background:var(--fusen);border:0;box-shadow:2px 3px 0 rgba(0,0,0,.08);transform:rotate(-.6deg)}
.done{margin-top:26px;border:3px double var(--blue);padding:22px;text-align:center;display:grid;gap:10px;position:relative}
.done h2{margin:0;font-size:22px;letter-spacing:.3em;color:var(--blue)}
.done .big{font-family:var(--brush);font-size:clamp(60px,16vw,110px);color:var(--red);border:4px solid var(--red);border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center;margin:0 auto;transform:rotate(-8deg);line-height:1}
.done p{margin:0;font-size:14px}
textarea.share{min-height:120px;font-size:14px;line-height:1.7;background:var(--paper);border:1px solid var(--rule);padding:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-size:14px;font-weight:700;padding:10px 18px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none;letter-spacing:.1em}
.btn.primary{background:var(--fg);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.foot{margin-top:22px;font-size:12px;color:var(--mute);line-height:1.8}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d1b17;color:#fbfaf5;padding:10px 18px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="sheet">
  <div class="head">
    <div><h1>遅刻理由届</h1><p class="sub">言い訳ゲーム ── 書けば書くほど、条件が増える。</p></div>
    <div class="box"><span>受付番号</span><b id="no">第 1 号</b><span id="today"></span></div>
  </div>

  <div class="field">
    <div class="lbl"><span>理由（下記の条件をすべて満たすこと）</span><span><span id="len">0</span> 文字</span></div>
    <textarea id="t" placeholder="例：本日は誠に申し訳ございません。" autocomplete="off" spellcheck="false"></textarea>
  </div>

  <div class="rules" id="rules"></div>

  <div class="done" id="done" hidden>
    <h2>受　理</h2>
    <div class="big">受理</div>
    <p id="donemsg"></p>
    <textarea class="share" id="share" readonly aria-label="シェア用テキスト"></textarea>
    <div class="btns"><button class="btn primary" id="copy" type="button">コピー</button><a class="btn" id="xlink" href="#" target="_blank" rel="noopener">Xに投稿</a><button class="btn" id="again" type="button">もう一度</button></div>
  </div>

  <p class="foot">条件は1つ満たすごとに次が現れます。全20条件。文字数は句読点を含みます。途中経過は自動で保存され、ページを閉じても続きから書けます。</p>
</div>
<div class="toast" id="toast">コピーしました</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const ANIMALS=['犬','猫','鳩','カラス','鹿','熊','猿','象','蛇','亀','馬','牛','豚','鶏','鴨','鯉','蛙','蝉','蟻','羊','狐','狸','イヌ','ネコ','ハト','クマ','サル','ゾウ','ヘビ','カメ','ウマ','ウシ','ブタ','ニワトリ','カエル','セミ','アリ','ヒツジ','キツネ','タヌキ','パンダ','ライオン','キリン','ペンギン','イルカ','クジラ','タコ','イカ','カニ','スズメ','ツバメ','フクロウ','ワニ','トラ','ネズミ','うさぎ','ウサギ','兎','虎','鼠','烏','雀','燕','蛸','烏賊','蟹','鯨','鼠'];
  const WEATHER=['雨','雪','晴','曇','風','雷','霧','台風','虹','嵐','みぞれ','あられ','ひょう','猛暑','酷暑','寒波'];
  const PREF=['北海道','青森','岩手','宮城','秋田','山形','福島','茨城','栃木','群馬','埼玉','千葉','東京','神奈川','新潟','富山','石川','福井','山梨','長野','岐阜','静岡','愛知','三重','滋賀','京都','大阪','兵庫','奈良','和歌山','鳥取','島根','岡山','広島','山口','徳島','香川','愛媛','高知','福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島','沖縄'];
  const DAYS=['月曜','火曜','水曜','木曜','金曜','土曜','日曜'];
  const FOOD=['カレー','寿司','ラーメン','おにぎり','うどん','パン','卵','味噌汁','餃子','唐揚げ','たこ焼き','みかん','りんご','バナナ','チョコ','パスタ','蕎麦','そば','牛丼','天ぷら','焼肉','ハンバーグ','おでん','納豆','豆腐','ケーキ','団子','大福','せんべい','プリン'];
  const KIGO=['桜','紅葉','雪','蝉','花火','こたつ','梅雨','扇風機','かき氷','月見','初詣','風鈴','夕立','木枯らし','新緑','落ち葉','蛍','向日葵','ひまわり','クリスマス','正月','七夕','節分','鯉のぼり','スイカ','すいか','年賀状'];
  const PALIN=['トマト','しんぶんし','新聞紙','たけやぶやけた','竹やぶ焼けた','わたしまけましたわ','キツツキ','きつつき','ミルクルミ','ヤオヤ','やおや','八百屋','だんすがすんだ','イカとカイ','なつまでまつな','るすにするな','留守にするな','かいいか','まさかさかさま','よのなかねかおかおかねかなのよ'];
  const digitsSum=t=>{const m=t.normalize('NFKC').match(/\d/g);return m?m.reduce((s,d)=>s+ +d,0):0;};
  const hasDigit=t=>/\d/.test(t.normalize('NFKC'));
  const len=t=>[...t.replace(/\s/g,'')].length;
  const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;};
  const hira=t=>{const s=[...t.replace(/\s/g,'')];if(!s.length)return 0;return s.filter(c=>/[ぁ-ゖー]/.test(c)).length/s.length;};
  const any=(t,arr)=>arr.some(w=>t.includes(w));
  const RULES=[
    ['20文字以上で書くこと',t=>len(t)>=20],
    ['「申し訳」という言葉を含めること',t=>t.includes('申し訳'),'謝罪のない言い訳は言い訳ではない'],
    ['動物を1種類以上登場させること',t=>any(t,ANIMALS),'犬、鳩、カラス、ゾウなど'],
    ['天気に触れること',t=>any(t,WEATHER),'雨、雪、晴、曇、風、雷、霧、虹…'],
    ['数字を含め、その合計を7の倍数にすること',t=>hasDigit(t)&&digitsSum(t)%7===0,'例：「3時間」と「4分」で合計7'],
    ['「電車」「バス」「渋滞」を使わないこと',t=>!any(t,['電車','バス','渋滞']),'ありきたりな言い訳は却下'],
    ['都道府県名を1つ含めること',t=>any(t,PREF)],
    ['「でした。」で終わること',t=>t.trimEnd().endsWith('でした。')],
    ['曜日を含めること',t=>any(t,DAYS),'月曜〜日曜'],
    ['総文字数を素数にすること',t=>isPrime(len(t)),'現在の文字数は右上に表示'],
    ['「部長」を含め、その直前に「本当に」を置くこと',t=>t.includes('本当に部長')],
    ['ひらがなの割合を40〜60%にすること',t=>{const h=hira(t);return h>=.4&&h<=.6;},'漢字だらけでも、ひらがなだらけでも不可'],
    ['食べ物を1つ含めること',t=>any(t,FOOD),'カレー、おにぎり、唐揚げ、みかん…'],
    ['「！」をちょうど1つ使うこと',t=>(t.match(/[!！]/g)||[]).length===1],
    ['季語を含めること',t=>any(t,KIGO),'桜、蝉、花火、こたつ、梅雨、風鈴…'],
    ['「私」「僕」「自分」を使わないこと',t=>!any(t,['私','僕','自分','俺']),'主語を消すのが大人の言い訳'],
    ['回文を含めること',t=>any(t,PALIN),'トマト、新聞紙、竹やぶ焼けた、キツツキ…'],
    ['数字の合計をちょうど42にすること',t=>digitsSum(t)===42,'7の倍数のまま、42へ'],
    ['「結論から言うと」を前半に置くこと',t=>{const i=t.indexOf('結論から言うと');return i>=0&&i<len(t)/2;}],
    ['全体を200文字以内に収めること',t=>len(t)<=200,'圧縮せよ'],
  ];
  const store={get(k,d){try{const v=localStorage.getItem('iiwake:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('iiwake:'+k,JSON.stringify(v));}catch(e){}}};
  let shown=1, prevShown=1;
  $('today').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
  $('t').value=store.get('text','');
  function evaluate(){
    const t=$('t').value; $('len').textContent=len(t); store.set('text',t);
    let firstFail=-1;
    const res=RULES.map((r,i)=>{const ok=r[1](t); if(!ok&&firstFail<0) firstFail=i; return ok;});
    // 表示する条件数：先頭から連続で満たした数+1（最大20）
    let k=0; while(k<RULES.length&&res[k]) k++;
    shown=Math.max(shown,Math.min(RULES.length,k+1));
    const html=[]; for(let i=0;i<shown;i++){ const ok=res[i]; const isNew=i>=prevShown; html.push(`<div class="rule ${ok?'pass':'fail'} ${isNew?'new fusen':''}"><div class="no">第${i+1}条</div><div class="tx">${RULES[i][0]}${RULES[i][2]?`<small>${RULES[i][2]}</small>`:''}</div><div class="stamp">${ok?'可':'却下'}</div></div>`); }
    $('rules').innerHTML=html.reverse().join(''); prevShown=shown;
    $('no').textContent=`第 ${shown} 号`;
    const all=res.every(Boolean)&&shown===RULES.length;
    $('done').hidden=!all;
    if(all){ const n=len(t); $('donemsg').textContent=`全20条件を満たした、${n}文字の言い訳が受理されました。`;
      const text=`言い訳ゲーム：全20条件クリア（${n}文字）\n「${t.trim()}」\n#言い訳ゲーム`; $('share').value=text;
      $('xlink').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(text+'\n'+location.href.split('#')[0]); }
  }
  $('t').addEventListener('input',evaluate);
  $('again').addEventListener('click',()=>{$('t').value='';shown=1;prevShown=1;evaluate();$('t').focus();});
  $('copy').addEventListener('click',()=>{const s=$('share');navigator.clipboard&&navigator.clipboard.writeText(s.value).then(()=>{$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1500);}).catch(()=>s.select());});
  evaluate();
})();
</script>
