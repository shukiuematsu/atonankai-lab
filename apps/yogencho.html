<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="description" content="時間を大切にするための、小さなブラウザアプリ集。無料・登録不要・データは端末の中だけ。"><link rel="canonical" href="https://shukiuematsu.github.io/atonankai-lab/apps/yogencho.html"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1422'/%3E%3Cellipse cx='16' cy='16' rx='9' ry='5.5' fill='%23e58aa3' transform='rotate(-35 16 16)'/%3E%3C/svg%3E"><meta property="og:type" content="website"><meta property="og:site_name" content="あと何回 ラボ"><meta property="og:title" content="予言帳"><meta property="og:description" content="時間を大切にするための、小さなブラウザアプリ集。無料・登録不要・データは端末の中だけ。"><meta property="og:url" content="https://shukiuematsu.github.io/atonankai-lab/apps/yogencho.html"><meta property="og:image" content="https://shukiuematsu.github.io/atonankai-lab/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="予言帳"><meta name="twitter:description" content="時間を大切にするための、小さなブラウザアプリ集。無料・登録不要・データは端末の中だけ。"><meta name="twitter:image" content="https://shukiuematsu.github.io/atonankai-lab/og.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><script>window.claude=window.claude||{use:async function(n){if(n!=="downloads")return null;return{save:async function(r){var b=r.data instanceof Blob?r.data:new Blob([r.data]);var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);return{status:"saved"}}}}};</script><title>予言帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 布置: 左に確信度ダイヤル、右に帳簿。判断の精度を数字にする。 */
:root{--bg:#eef0ef;--paper:#fbfcfb;--fg:#131a18;--mute:#64706c;--line:#d3dad6;--accent:#0f766e;--warn:#b45309;--hit:#15803d;--miss:#b91c1c;--soft:#e4ecea;
  --mono:"IBM Plex Mono",ui-monospace,monospace;--body:"Zen Kaku Gothic New","Hiragino Sans",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1413;--paper:#151d1b;--fg:#e8eeec;--mute:#93a19c;--line:#283431;--accent:#2dd4bf;--warn:#f59e0b;--hit:#4ade80;--miss:#f87171;--soft:#1b2623;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1413;--paper:#151d1b;--fg:#e8eeec;--mute:#93a19c;--line:#283431;--accent:#2dd4bf;--warn:#f59e0b;--hit:#4ade80;--miss:#f87171;--soft:#1b2623;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:16px}
h1{font-family:var(--mono);font-size:28px;margin:0;letter-spacing:.02em}
.lead{color:var(--mute);font-size:14px;margin:2px 0 0;max-width:42em}
.cols{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{font-size:12px;letter-spacing:.15em;color:var(--mute);margin:0;font-weight:700}
textarea,input[type=date],select{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent)}
.dial{display:grid;place-items:center;position:relative}
.dial svg{width:220px;max-width:100%;height:auto}
.dial .v{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:var(--mono)}
.dial .v b{font-size:44px;display:block;line-height:1}
.dial .v small{color:var(--mute);font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:inherit;font-weight:700;font-size:14px;padding:11px 16px;border-radius:8px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--soft);border-radius:8px;padding:10px 12px}
.kpi .k{font-size:11px;color:var(--mute)}
.kpi .n{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1.2}
.kpi .n small{font-size:12px;color:var(--mute);font-weight:500}
.cal{display:grid;gap:6px}
.cal div{display:grid;grid-template-columns:62px 1fr 1fr 60px;gap:8px;align-items:center;font-size:12px}
.cal .b{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.cal .b i{display:block;height:100%;background:var(--accent)}
.cal .b.act i{background:var(--warn)}
.cal .n{font-family:var(--mono);text-align:right}
.list{display:grid;gap:8px}
.it{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.it .c{font-family:var(--mono);font-weight:700;font-size:18px;text-align:center}
.it .t{min-width:0}
.it .t small{display:block;color:var(--mute);font-size:12px}
.it.hit{border-color:var(--hit)}.it.miss{border-color:var(--miss);opacity:.85}
.it .acts{display:flex;gap:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.tab[aria-pressed=true]{background:var(--fg);color:var(--paper);border-color:var(--fg)}
.ex{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 4px;margin-left:4px}
.note{font-size:12px;color:var(--mute);line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
<div class="wrap">
  <div><h1>予言帳</h1><p class="lead">「たぶん通る」「多分来ない」を数字で書き留めて、あとで答え合わせ。あなたの判断がどれだけ当たるか、過信しているかが見えてきます。</p></div>
  <div class="cols">
    <div class="panel">
      <h2>新しい予言</h2>
      <textarea id="txt" placeholder="例：A社との契約は12月中に締結される"></textarea>
      <div class="row2"><label style="font-size:12px;color:var(--mute)">いつ分かる？<input type="date" id="due"></label><label style="font-size:12px;color:var(--mute)">分類<select id="cat"><option>仕事</option><option>市場</option><option>人</option><option>自分</option><option>その他</option></select></label></div>
      <div class="dial"><svg viewBox="0 0 200 130" aria-hidden="true"><path d="M20 110 A80 80 0 0 1 180 110" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/><path id="arc" d="M20 110 A80 80 0 0 1 180 110" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="125"/></svg><div class="v"><b id="cv">75</b><small>% 確信</small></div></div>
      <input type="range" id="conf" min="50" max="99" value="75" aria-label="確信度">
      <div class="note" id="confnote"></div>
      <button class="btn primary" id="add" type="button">帳簿に記す</button>
    </div>
    <div style="display:grid;gap:16px;min-width:0">
      <div class="panel"><h2>あなたの判断力</h2><div class="kpis" id="kpis"></div><div class="cal" id="cal"></div><p class="note">較正：確信度ごとに「実際に当たった割合」を比べます。80%と言ったものが80%当たれば完璧。上回れば控えめ、下回れば過信。Brierスコアは0が最高、0.25は当てずっぽう。</p></div>
      <div class="panel"><div class="tabs"><button class="tab" data-f="open" aria-pressed="true" type="button">答え待ち</button><button class="tab" data-f="done" aria-pressed="false" type="button">答え合わせ済み</button></div><div class="list" id="list"></div><div class="note">データはこの端末にだけ保存されます。<span class="ex">例</span>の付いた行はサンプルで、消せます。</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const store={get(k,d){try{const v=localStorage.getItem('yogen:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('yogen:'+k,JSON.stringify(v));}catch(e){}}};
  const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
  let items=store.get('items',null);
  if(!items){ items=[
    {id:1,t:'来週の提案、先方は一度持ち帰る',c:80,cat:'仕事',due:day(-20),r:true,ex:1},{id:2,t:'新機能のリリースは予定通りの日に出る',c:70,cat:'仕事',due:day(-15),r:false,ex:1},{id:3,t:'採用した2人は3か月以内に戦力になる',c:85,cat:'人',due:day(-10),r:true,ex:1},{id:4,t:'競合は年内に値下げしてくる',c:60,cat:'市場',due:day(-5),r:false,ex:1},{id:5,t:'月末までに10万円貯金できる',c:90,cat:'自分',due:day(-2),r:false,ex:1},{id:6,t:'四半期の売上目標を達成する',c:65,cat:'仕事',due:day(-1),r:true,ex:1},
    {id:7,t:'次の1on1で部下から異動希望が出る',c:55,cat:'人',due:day(7),r:null,ex:1},{id:8,t:'社内のAI活用ガイドラインが来月までに出る',c:75,cat:'仕事',due:day(30),r:null,ex:1}]; store.set('items',items); }
  let filter='open';
  $('due').value=day(30);
  function dial(){const c=+$('conf').value;$('cv').textContent=c;$('arc').setAttribute('stroke-dashoffset',String(251-(c-50)/49*251));$('confnote').textContent=c>=95?'95%以上は「ほぼ確実」。外れると帳簿に大きく響きます。':c>=80?'「かなり自信がある」。5回に1回は外れる計算です。':c>=65?'「たぶん」。3回に1回は外れます。':'五分五分に近い。それでも書く価値はあります。';}
  $('conf').addEventListener('input',dial); dial();
  $('add').addEventListener('click',()=>{const t=$('txt').value.trim();if(!t){toast('予言の内容を書いてください');return;}items.unshift({id:Date.now(),t,c:+$('conf').value,cat:$('cat').value,due:$('due').value,r:null});store.set('items',items);$('txt').value='';filter='open';[...document.querySelectorAll('.tab')].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f==='open')));render();toast('記しました');});
  document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;filter=b.dataset.f;[...document.querySelectorAll('.tab')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();});
  $('list').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const it=items.find(x=>x.id===+b.dataset.id);if(!it)return;if(b.dataset.a==='del')items=items.filter(x=>x!==it);else if(b.dataset.a==='hit')it.r=true;else if(b.dataset.a==='miss')it.r=false;else if(b.dataset.a==='reopen')it.r=null;store.set('items',items);render();});
  function render(){
    const done=items.filter(x=>x.r!==null); const open=items.filter(x=>x.r===null);
    const brier=done.length?done.reduce((s,x)=>s+Math.pow(x.c/100-(x.r?1:0),2),0)/done.length:null;
    const hit=done.length?done.filter(x=>x.r).length/done.length:null; const avgc=done.length?done.reduce((s,x)=>s+x.c,0)/done.length/100:null;
    const over=hit!=null?Math.round((avgc-hit)*100):null;
    $('kpis').innerHTML=[['答え合わせ済み',done.length,'件'],['的中率',hit==null?'—':Math.round(hit*100),hit==null?'':'%'],['平均確信度',avgc==null?'—':Math.round(avgc*100),avgc==null?'':'%'],['過信度',over==null?'—':(over>0?'+':'')+over,over==null?'':'pt'],['Brier',brier==null?'—':brier.toFixed(3),'']].map(([k,n,u])=>`<div class="kpi"><div class="k">${k}</div><div class="n">${n}<small>${u}</small></div></div>`).join('');
    const B=[[50,64],[65,79],[80,89],[90,99]];
    $('cal').innerHTML=B.map(([lo,hi])=>{const g=done.filter(x=>x.c>=lo&&x.c<=hi);const h=g.length?g.filter(x=>x.r).length/g.length:null;const mid=(lo+hi)/2;return `<div><span>${lo}–${hi}%</span><span class="b"><i style="width:${mid}%"></i></span><span class="b act"><i style="width:${h==null?0:h*100}%"></i></span><span class="n">${h==null?'—':Math.round(h*100)+'%'}</span></div>`;}).join('')+`<div style="color:var(--mute)"><span></span><span>言った確信度</span><span>実際の的中率</span><span></span></div>`;
    const rows=(filter==='open'?open:done).sort((a,b)=>filter==='open'?a.due.localeCompare(b.due):b.due.localeCompare(a.due));
    const today=day(0);
    $('list').innerHTML=rows.length?rows.map(x=>`<div class="it ${x.r===true?'hit':x.r===false?'miss':''}"><div class="c">${x.c}%</div><div class="t">${x.t}${x.ex?'<span class="ex">例</span>':''}<small>${x.cat} ・ ${x.due}${x.r===null&&x.due<=today?' ・ <b style="color:var(--warn)">答え合わせの時期</b>':''}${x.r===true?' ・ 的中':x.r===false?' ・ 外れ':''}</small></div><div class="acts">${x.r===null?`<button class="btn sm" data-a="hit" data-id="${x.id}" type="button">当たった</button><button class="btn sm" data-a="miss" data-id="${x.id}" type="button">外れた</button>`:`<button class="btn sm" data-a="reopen" data-id="${x.id}" type="button">戻す</button>`}<button class="btn sm" data-a="del" data-id="${x.id}" type="button" aria-label="削除">×</button></div></div>`).join(''):'<div class="note">まだありません。</div>';
  }
  function toast(m){$('toast').textContent=m;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1500);}
  render();
})();
</script>
</head><body></body></html>
